# Capability metadata for AgentDojo's banking + workspace suites (34 tools),
# in the same schema as IndabaX's config/capabilities.yaml -- but this file
# lives entirely outside that repo (~/agentdojo/), loaded by a second,
# separate defense server instance on port 8081 via a runtime monkeypatch of
# defense.capabilities.DEFAULT_CAPABILITIES_PATH. config/capabilities.yaml
# itself is never touched.
#
# Judgment calls (AgentDojo has no equivalent authoring doc to read these
# off of, unlike the Sentinel Starter Kit's own tools.py):
#   - requires_predecessor is empty everywhere: AgentDojo has no explicit
#     prepare->confirm->execute chain the way the finance domain does.
#   - reversible follows "does a tool in THIS list undo it" literally
#     (e.g. update_scheduled_transaction undoes schedule_transaction, so
#     schedule_transaction is reversible; delete_file/delete_email/
#     cancel_calendar_event/share_file have no undo tool, so false).

tools:
