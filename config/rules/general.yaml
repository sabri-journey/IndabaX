# General (domain-agnostic) rules, evaluated for every candidate action.
#
# "Forbid before allow": every rule here only ever *adds* a Finding -- there
# is no "allow" rule kind that can cancel one out, so an append-only findings
# list already gives forbid-before-allow semantics without needing explicit
# precedence logic (src/defense/stage2_policy.py).
#
# "Default-deny on consequential tools": GEN-CONSEQUENTIAL-APPROVAL fires for
# every tool whose CapabilityRegistry.is_consequential(args) is true (F1),
# with no opt-out, until state_machine.is_confirmed() says a harness-recorded
# human approval exists for that exact action.
#
# Which tools/arguments a rule applies to is loaded from YAML (data); the
# evaluator for each `kind` is one of a small, fixed set of Python functions
# (src/defense/stage2_policy.py) -- see that module's docstring for why this
# is a deliberate simplification of a fully generic Progent-style DSL, not
# an oversight.

rules:
  - id: GEN-TOOL-NOT-ALLOWED
    kind: tool_permission
    severity: critical
    reason_code: TOOL_NOT_REQUIRED_FOR_GOAL
    description: >
      The tool is outside this task's declared allowed_tools. Mirrors
      PolicyEngine's tool_permission rule in the starter kit.

  - id: GEN-UNKNOWN-TOOL
    kind: unknown_tool
    severity: critical
    reason_code: UNKNOWN_TOOL
    description: >
      The tool is not in our capability registry at all -- fail closed
      rather than reason about a tool we have no metadata for.

  - id: GEN-PREREQUISITE
    kind: prerequisite
    severity: high
    reason_code: MISSING_PREREQUISITE
    description: >
      A required predecessor tool (config/capabilities.yaml
      requires_predecessor) has not succeeded in this session. Enforced
      defense-side, pre-execution -- see state_machine.py.

  - id: GEN-CONSEQUENTIAL-APPROVAL
    kind: consequential_approval
    severity: critical
    reason_code: MISSING_CONFIRMATION
    description: >
      A consequential tool call (CapabilityRegistry.is_consequential) has no
      matching entry in history_digest.confirmations_granted -- the
      harness's own structured record of a real escalate -> human_confirm
      round trip. Never satisfied by text content (state_machine.py).

  - id: GEN-INSTRUCTION-MIRRORS-UNTRUSTED
    kind: instruction_mirrors_untrusted
    applies_to: consequential_or_sink
    severity: high
    reason_code: UNTRUSTED_INSTRUCTION_SOURCE
    description: >
      The tool name and an argument value co-occur inside untrusted-or-worse
      content the agent read -- the action looks dictated by that content,
      not decided independently. Catches "call payment_confirm with
      {payment_id: PAY-0001}" spelled out in a merchant letter even when
      PAY-0001 is itself a legitimately-created id. Scoped to consequential-
      or-sink tools only: a pure read (document_read, email_read, ...) is
      not dangerous merely because an attacker also suggested it -- a
      poisoned document routinely mentions genuinely on-topic, otherwise-
      legitimate tool calls (e.g. re-reading the very document that carries
      the injection) to blend in. Found as a real false positive on
      enterprise_memory_poison's legitimate document_read(DOC-3104) step; the
      actual risk in that scenario is downstream, when the read content
      reaches a sink (GEN-SINK-DESTINATION-PROVENANCE /
      GEN-SENSITIVE-TO-UNTRUSTED-SINK catch that step instead).

  - id: GEN-PROVENANCE-CONSEQUENTIAL
    kind: provenance_condition
    applies_to: consequential
    max_trust: trusted_internal
    severity: high
    reason_code: UNTRUSTED_ARGUMENT_PROVENANCE
    description: >
      For a consequential tool call, the least-trusted traced argument must
      not be untrusted_internal or below.

  - id: GEN-SINK-DESTINATION-PROVENANCE
    kind: destination_provenance
    applies_to: sink
    destination_argument: to
    max_trust: trusted_internal
    severity: high
    reason_code: UNTRUSTED_DESTINATION_SOURCE
    description: >
      For any sink tool (email_send, email_draft, ...), the destination
      argument must not trace to untrusted-or-worse content -- catches a
      recipient address redirected by injected instructions (including via
      tainted memory), regardless of whether the tool itself is
      consequential (email_draft is not, but a redirected draft is still
      the exfiltration risk).

  - id: GEN-SECRET-TO-UNTRUSTED-SINK
    kind: secret_sink
    severity: critical
    reason_code: SECRET_TO_UNTRUSTED_SINK
    description: >
      A sink tool's outbound text (arguments + content) contains a
      canary/secret (secrets.py, every documented encoding) and the resolved
      destination is not trusted_internal.

  - id: GEN-SENSITIVE-TO-UNTRUSTED-SINK
    kind: sensitive_sink
    severity: critical
    reason_code: SENSITIVE_TO_UNTRUSTED_SINK
    description: >
      A sink tool's outbound text traces (in whole or in a
      provenance.trace_bulk_text window) to confidential/restricted content,
      and the resolved destination is not trusted_internal.
